name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERVIEW_REF: 9d2148dd525d9ad3cce62c9363fea219a541e963

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    # Bare distro image, same reasoning as in ci.yml: nothing ROS, nothing preinstalled.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      # git has to be there before actions/checkout, otherwise it downloads a tarball without
      # `.git` and the patch diff below has nothing to diff against.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            g++ \
            git \
            libgtest-dev \
            ninja-build \
            python3-venv

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: src/epaper_driver
          # Patch coverage needs `git merge-base master HEAD`, which the default depth of 1
          # cannot answer.
          fetch-depth: 0

      # A fixed location keeps the absolute `SF:` paths predictable for the normalization step.
      - name: Setup workspace
        run: |
          mkdir -p /workspace
          mv src/epaper_driver /workspace/

      - name: Install coverage dependencies
        working-directory: /workspace
        env:
          # Pinned so an upstream change cannot silently break the coverage job.
          FASTCOV_VERSION: "1.17"
          INFO_PROCESS_REF: 63f8a031f31e514458ee4fc78c4b53a82301a218
        run: |
          python3 -m venv /workspace/.venv
          source /workspace/.venv/bin/activate
          pip3 install "fastcov==${FASTCOV_VERSION}"
          pip3 install "git+https://github.com/antmicro/info-process.git@${INFO_PROCESS_REF}"

      # `-fprofile-update=atomic` is kept for parity with the other Scorpio repos: it costs
      # nothing here and stays correct if a test ever grows a thread.
      - name: Build
        run: |
          cmake -S /workspace/epaper_driver -B /workspace/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" \
            -DCMAKE_CXX_OUTPUT_EXTENSION_REPLACE=ON
          cmake --build /workspace/build

      # A failing test still produces a coverage report; the CI workflow is the one that fails
      # on it.
      - name: Run tests
        run: |
          if ! ctest --test-dir /workspace/build --output-on-failure; then
            echo "::warning::some tests failed, coverage is reported anyway (CI fails on them)"
          fi

      # Patch coverage base. On a pull_request event the checked out HEAD is the merge commit, so
      # the merge base against master is the master tip this run was built on.
      - name: Compute patch diff
        id: patch_diff
        if: github.event_name == 'pull_request'
        working-directory: /workspace/epaper_driver
        run: |
          git config --global --add safe.directory /workspace/epaper_driver

          # Defensive: `fetch-depth: 0` already brings every branch in, but a fetch spec change
          # upstream should degrade into the base-sha fallback below, not into a hard failure.
          git fetch --no-tags --quiet origin +refs/heads/master:refs/remotes/origin/master || true

          BASE_SHA="$(git merge-base origin/master HEAD || true)"
          if [ -z "${BASE_SHA}" ]; then
            echo "::warning::git merge-base failed, falling back to the PR base sha"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          fi
          echo "Patch coverage base: ${BASE_SHA}"

          # Restricted to C/C++ sources: they are the only thing gcov can describe, and it keeps
          # binary / mode-change hunks away from fastcov's diff parser, which raises
          # DiffParseError on any hunk line it cannot classify.
          PATHSPEC=('*.cpp' '*.hpp' '*.cc' '*.c' '*.h' '*.cxx' '*.hh' '*.hxx')

          git diff --no-color --no-ext-diff "${BASE_SHA}" HEAD -- "${PATHSPEC[@]}" \
            > /workspace/patch.diff

          CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" HEAD -- "${PATHSPEC[@]}" | wc -l)"
          echo "Changed C/C++ files: ${CHANGED_FILES}"
          git --no-pager diff --stat "${BASE_SHA}" HEAD -- "${PATHSPEC[@]}"

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "changed_files=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"
          if [ -s /workspace/patch.diff ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      # `/workspace/build/` also covers the FetchContent GoogleTest under `_deps`, in case the
      # system one ever goes missing.
      - name: Generate coverage report (fastcov)
        working-directory: /workspace
        run: |
          source /workspace/.venv/bin/activate

          mkdir -p /workspace/coverage_data

          fastcov \
            --search-directory build \
            --process-gcno \
            --branch-coverage \
            --exclude /usr/include/ /usr/lib/ /workspace/build/ \
            --jobs "$(nproc)" \
            --lcov \
            --output /workspace/coverage_data/coverage.info

      # `--add-tracefile` re-reads the report produced above instead of invoking gcov again, so the
      # patch report costs a couple of seconds. `--diff-filter` keeps only files named in the diff
      # and, inside them, only the added lines (function records are dropped by design).
      # `--diff-base-dir` is joined onto the diff's `b/` paths, so this has to run while the
      # `SF:` entries are still absolute - the path normalization happens in the next step.
      - name: Generate patch coverage report (fastcov --diff-filter)
        id: patch_report
        if: github.event_name == 'pull_request' && steps.patch_diff.outputs.has_diff == 'true'
        working-directory: /workspace
        run: |
          source /workspace/.venv/bin/activate

          mkdir -p /workspace/patch_coverage_data

          # Named coverage.info because that is the filename gen-coverview-data.py writes into
          # config.json; the two reports live in separate data directories.
          fastcov \
            --add-tracefile /workspace/coverage_data/coverage.info \
            --diff-filter /workspace/patch.diff \
            --diff-base-dir /workspace/epaper_driver \
            --branch-coverage \
            --lcov \
            --output /workspace/patch_coverage_data/coverage.info

          # An info file without a single SF: record means the diff added no line that carries
          # coverage data - e.g. only comments, blank lines or declarations. fastcov keeps added
          # (`+`) lines only, so that case is expected, not an error.
          if grep -q '^SF:' /workspace/patch_coverage_data/coverage.info; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize source paths
        working-directory: /workspace
        run: |
          sed -i 's|/workspace/epaper_driver/||g' /workspace/coverage_data/coverage.info
          if [ -f /workspace/patch_coverage_data/coverage.info ]; then
            sed -i 's|/workspace/epaper_driver/||g' /workspace/patch_coverage_data/coverage.info
          fi

      # Runs before the summary so the LF/LH/BRF/BRH totals reflect the filtered set.
      # `info-process transform` edits the file in place and recomputes those counters.
      - name: Filter coverage data (info-process)
        working-directory: /workspace
        run: |
          source /workspace/.venv/bin/activate

          # Filter out everything that is inside `test` directory or is a .cpp file named
          # `test.cpp` / prefixed with `test_`
          for info in /workspace/coverage_data/coverage.info /workspace/patch_coverage_data/coverage.info; do
            if [ -f "${info}" ]; then
              info-process transform \
                --filter-out '(\/|^)test(\/|(_\w+)?\.cpp)' \
                "${info}"
            fi
          done

      - name: Verify tests excluded from coverage data
        run: |
          # `info-process transform` exits 0 when its regex matches nothing, so a bad pattern or
          # a rename that shifts test paths would silently publish coverage padded with test
          # sources. Fail hard instead.
          for info in /workspace/coverage_data/coverage.info /workspace/patch_coverage_data/coverage.info; do
            if [ -f "${info}" ] && grep -nE '^SF:([^:]*/)?test(/|(_[A-Za-z0-9_]+)?\.cpp)' "${info}"; then
              echo "::error::test sources still present in ${info} after filtering"
              exit 1
            fi
          done

      - name: Compute coverage summary
        id: coverage_summary
        run: |
          # $1 = info file, $2 = output name prefix ("" for the full report, "patch_" for the
          # diff-filtered one). A patch that adds no instrumented line reports n/a rather than 0%.
          summarize() {
            awk -F: -v p="$2" '
              /^LF:/ { lf += $2 }
              /^LH:/ { lh += $2 }
              /^BRF:/ { brf += $2 }
              /^BRH:/ { brh += $2 }
              END {
                if (lf > 0) {
                  printf "%sline_pct=%.2f\n", p, lh / lf * 100
                } else {
                  printf "%sline_pct=n/a\n", p
                }
                if (brf > 0) {
                  printf "%sbranch_pct=%.2f\n", p, brh / brf * 100
                } else {
                  printf "%sbranch_pct=n/a\n", p
                }
                printf "%slines=%d/%d\n", p, lh, lf
                printf "%sbranches=%d/%d\n", p, brh, brf
              }
            ' "$1" >> "$GITHUB_OUTPUT"
          }

          summarize /workspace/coverage_data/coverage.info ""
          if [ -f /workspace/patch_coverage_data/coverage.info ]; then
            summarize /workspace/patch_coverage_data/coverage.info "patch_"
          fi

      - name: Prepare coverview data
        working-directory: /workspace
        run: |
          python3 /workspace/epaper_driver/scripts/gen-coverview-data.py \
            --info /workspace/coverage_data/coverage.info \
            --repo-root /workspace/epaper_driver \
            --out-dir /workspace/coverage_data \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}"

      - name: Prepare patch coverview data
        if: steps.patch_report.outputs.has_data == 'true'
        working-directory: /workspace
        env:
          BASE_SHA: ${{ steps.patch_diff.outputs.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 /workspace/epaper_driver/scripts/gen-coverview-data.py \
            --info /workspace/patch_coverage_data/coverage.info \
            --repo-root /workspace/epaper_driver \
            --out-dir /workspace/patch_coverage_data \
            --repo "${{ github.repository }}" \
            --title "epaper_driver patch coverage" \
            --branch "${HEAD_REF} (patch vs ${BASE_SHA:0:8})" \
            --commit "${{ github.sha }}"

      - name: Verify tests excluded from coverview sources
        run: |
          for sources in /workspace/coverage_data/sources.txt /workspace/patch_coverage_data/sources.txt; do
            if [ -f "${sources}" ] && grep -nE '^### FILE: ([^ ]*/)?test/' "${sources}"; then
              echo "::error::test sources still present in ${sources}"
              exit 1
            fi
          done

      - name: Fetch coverview source
        run: |
          git clone --quiet https://github.com/antmicro/coverview.git /tmp/coverview
          git -C /tmp/coverview checkout --quiet "${{ env.COVERVIEW_REF }}"

      # Restore-only. `embed.py` mutates `dist/` in place, so a plain `actions/cache@v4`
      # would save the already-embedded site at the end of the job. The next run would then
      # restore it, find no `let originalFiles = {}` placeholder left to replace, silently
      # skip the injection and publish the previous run's data forever.
      - name: Restore cached coverview build
        id: cache-coverview-dist
        uses: actions/cache/restore@v4
        with:
          path: /tmp/coverview/dist
          key: coverview-dist-v2-${{ env.COVERVIEW_REF }}

      - name: Setup Node
        if: steps.cache-coverview-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build coverview
        id: build-coverview
        if: steps.cache-coverview-dist.outputs.cache-hit != 'true'
        working-directory: /tmp/coverview
        run: |
          npm ci
          npm run build

      # Saved here, before the embed step, so the cache only ever holds a pristine build.
      # Cache keys are immutable, so only save a build that actually succeeded.
      - name: Save coverview build cache
        if: steps.cache-coverview-dist.outputs.cache-hit != 'true' && steps.build-coverview.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/coverview/dist
          key: coverview-dist-v2-${{ env.COVERVIEW_REF }}

      - name: Embed coverage data
        working-directory: /tmp/coverview
        run: |
          # `embed.py` only ever writes `dist/index.html`, so each site is built from its own copy
          # of the pristine dist.
          cp -a dist /tmp/coverview/dist-pristine

          # $1 = coverview data directory, $2 = destination directory for the finished site
          embed_site() {
            rm -rf dist
            cp -a /tmp/coverview/dist-pristine dist

            # `embed.py` injects by a plain string replace and silently does nothing when the
            # placeholder is missing, which would publish a stale report. Fail instead.
            if ! grep -q 'let originalFiles = {}' dist/index.html; then
              echo "::error::dist/index.html has no embed placeholder - coverview dist is not pristine (stale cache?)"
              exit 1
            fi

            python3 embed.py --inject-data "$1"

            rm -rf dist/assets dist/index.html.bak
            rm -rf "$2"
            mv dist "$2"
          }

          embed_site /workspace/coverage_data /tmp/coverview/site-full
          if [ -f /workspace/patch_coverage_data/config.json ]; then
            embed_site /workspace/patch_coverage_data /tmp/coverview/site-patch
          fi

      - name: Upload coverage data artifact
        id: upload_data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          # Least common ancestor is /workspace, so the artifact keeps the directory layout.
          path: |
            /workspace/coverage_data
            /workspace/patch_coverage_data
            /workspace/patch.diff
          retention-days: 14

      - name: Upload coverview site artifact
        id: upload_site
        uses: actions/upload-artifact@v4
        with:
          name: coverview-site
          path: /tmp/coverview/site-full
          retention-days: 14

      - name: Upload patch coverview site artifact
        id: upload_patch_site
        if: steps.patch_report.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverview-site-patch
          path: /tmp/coverview/site-patch
          retention-days: 14

      # Needs Settings > Pages > Source set to "GitHub Actions", see the deploy job below.
      - name: Upload coverage report as Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/coverview/site-full

      # Fork PRs get a read-only GITHUB_TOKEN, so the POST below would fail the whole job. They
      # still get the report as artifacts.
      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LINE_PCT: ${{ steps.coverage_summary.outputs.line_pct }}
          # Not LINES: bash's checkwinsize clobbers that name with the terminal height (0
          # under a runner, which is how this row used to render as `(0)`).
          LINE_COUNTS: ${{ steps.coverage_summary.outputs.lines }}
          BRANCH_PCT: ${{ steps.coverage_summary.outputs.branch_pct }}
          BRANCH_COUNTS: ${{ steps.coverage_summary.outputs.branches }}
          PATCH_LINE_PCT: ${{ steps.coverage_summary.outputs.patch_line_pct }}
          PATCH_LINE_COUNTS: ${{ steps.coverage_summary.outputs.patch_lines }}
          PATCH_BRANCH_PCT: ${{ steps.coverage_summary.outputs.patch_branch_pct }}
          PATCH_BRANCH_COUNTS: ${{ steps.coverage_summary.outputs.patch_branches }}
          PATCH_HAS_DATA: ${{ steps.patch_report.outputs.has_data }}
          PATCH_HAS_DIFF: ${{ steps.patch_diff.outputs.has_diff }}
          PATCH_FILES: ${{ steps.patch_diff.outputs.changed_files }}
          BASE_SHA: ${{ steps.patch_diff.outputs.base_sha }}
          DATA_URL: ${{ steps.upload_data.outputs.artifact-url }}
          SITE_URL: ${{ steps.upload_site.outputs.artifact-url }}
          PATCH_SITE_URL: ${{ steps.upload_patch_site.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Posts a new comment every run (no upsert / no sticky header) so each push leaves
          # a fresh entry in the PR thread. python3 does the JSON escaping so the markdown
          # body cannot break the request.
          cell() {  # $1 = percentage or "n/a", $2 = hit/total counts
            if [ "$1" = "n/a" ] || [ -z "$1" ]; then
              printf 'n/a'
            else
              printf '%s%% (%s)' "$1" "$2"
            fi
          }

          FULL_ROW="| Full tree | $(cell "${LINE_PCT}" "${LINE_COUNTS}") | $(cell "${BRANCH_PCT}" "${BRANCH_COUNTS}") |"

          if [ "${PATCH_HAS_DATA}" = "true" ]; then
            PATCH_ROW="| Patch (vs \`${BASE_SHA:0:8}\`) | $(cell "${PATCH_LINE_PCT}" "${PATCH_LINE_COUNTS}") | $(cell "${PATCH_BRANCH_PCT}" "${PATCH_BRANCH_COUNTS}") |"
            PATCH_LINK="- Patch report (\`coverview-site-patch\`): ${PATCH_SITE_URL}"
          elif [ "${PATCH_HAS_DIFF}" = "true" ]; then
            # The diff reached fastcov but none of its added lines carries a coverage record:
            # comments, blank lines, declarations, or code in a file nothing links into a test.
            PATCH_ROW="| Patch (vs \`${BASE_SHA:0:8}\`) | no added instrumented lines in ${PATCH_FILES} changed file(s) | n/a |"
            PATCH_LINK="- Patch report: not generated - the ${PATCH_FILES} changed C/C++ file(s) add no instrumented line (comments, blank lines or declarations only)"
          else
            PATCH_ROW="| Patch (vs \`${BASE_SHA:0:8}\`) | no C/C++ files changed | n/a |"
            PATCH_LINK="- Patch report: not generated - no C/C++ files changed"
          fi

          BODY=$(cat <<EOF
          ### Coverage report

          | Report | Lines | Branches |
          | --- | --- | --- |
          ${FULL_ROW}
          ${PATCH_ROW}

          - Full report (\`coverview-site\`): ${SITE_URL}
          ${PATCH_LINK}
          - Raw data (\`coverage-data\`): ${DATA_URL}
          - Workflow run: ${RUN_URL}
          EOF
          )
          export BODY
          python3 -c 'import json, os, sys; sys.stdout.write(json.dumps({"body": os.environ["BODY"]}))' \
            | curl -fsSL -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments"

  # Publishes the master report at https://scorpioorganization.github.io/epaper_driver/.
  # One-time repo setup: Settings > Pages > Source = "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build_and_test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
